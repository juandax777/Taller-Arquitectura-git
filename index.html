<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Itinerario de vuelos</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
  </head>
  <body>
    <div class="container py-4 py-lg-5">
      <div class="row g-4 align-items-stretch">
        <div class="col-lg-5">
          <div class="card panel-card h-100">
            <div class="panel-header bg-primary text-white">
              Crear itinerario
            </div>
            <div class="card-body p-4">
              <form id="itineraryForm">
                <div class="mb-3">
                  <label for="departureAirport" class="form-label">Aeropuerto de salida</label>
                  <select id="departureAirport" class="form-select" required>
                    <option value="">Seleccione un aeropuerto</option>
                  </select>
                </div>

                <div class="mb-3">
                  <label for="arrivalAirport" class="form-label">Aeropuerto de llegada</label>
                  <select id="arrivalAirport" class="form-select" required>
                    <option value="">Seleccione un aeropuerto</option>
                  </select>
                </div>

                <div class="mb-4">
                  <label for="hourlyIntensity" class="form-label d-flex justify-content-between align-items-center">
                    <span>Intensidad horaria</span>
                    <span id="intensityValue" class="badge rounded-pill text-bg-primary">50%</span>
                  </label>
                  <input id="hourlyIntensity" type="range" class="form-range" min="10" max="100" value="50" />
                </div>

                <button type="submit" class="btn btn-primary w-100">Guardar itinerario</button>
              </form>
            </div>
          </div>
        </div>

        <div class="col-lg-7">
          <div class="card panel-card h-100">
            <div class="panel-header bg-success text-white">Mapa de Colombia</div>
            <div class="card-body p-0">
              <div id="colombiaMap" class="map-container"></div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
